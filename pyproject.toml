[project]
name = "pipe-yaml"
version = "0.1.0"
description = "A flexible ETL pipeline runner supporting multiple engines"
readme = "README.md"
#license = {text = "MIT"}
authors = [
    { name = "Aminadav Nachshon", email = "aminadaven@gmail.com" }
]
requires-python = ">=3.13"
keywords = ["etl", "pipeline", "duckdb", "spark", "yaml"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
]

dependencies = [
    "duckdb~=1.4.0",
    "jinja2~=3.1.6",
    "loguru>=0.7.3",
    "pydantic~=2.11.9",
    "pyspark==3.5.8",
    "python-dotenv~=1.1.1",
    "pyyaml~=6.0.3",
]

[project.urls]
Homepage = "https://github.com/aminadaven/pipe-yaml"
Repository = "https://github.com/aminadaven/pipe-yaml.git"
Issues = "https://github.com/aminadaven/pipe-yaml/issues"

[project.scripts]
etl = "pipe_yaml.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pipe_yaml"]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["pipe_yaml*"]

# Development dependencies
[dependency-groups]
dev = [
    "pytest>=7.0",
    "pytest-cov",
    "black",
    "isort",
    "ruff",
    "mypy",
]

# Tool configurations
[tool.black]
line-length = 88
target-version = ['py313']

[tool.isort]
profile = "black"
line_length = 88
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true

[tool.ruff]
line-length = 88
target-version = "py313"
select = ["E", "F", "I", "N", "B", "C4", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.13"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--strict-markers",
    "--strict-config",
    "--verbose",
    "--tb=short",
    "--cov=src/pipe_yaml",
    "--cov-report=term-missing",
    "--cov-report=html:htmlcov",
    "--cov-report=xml",
]
