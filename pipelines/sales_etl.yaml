pipeline: sales_etl
extract:
  - step: load_sales_data
    df: sales_data
    path: "data/sales.csv"
    format: csv
    cache: true
    options:
      header: true
transform:
  - step: debug_sales
    sql: SELECT * FROM sales_data limit 10
  - step: clean_sales
    sql: SELECT SUPPLIER, "ITEM TYPE", sum("WAREHOUSE SALES") AS SALES FROM sales_data GROUP BY SUPPLIER, "ITEM TYPE"
    df: clean_sales
  - step: debug_sales
    sql: SELECT * FROM clean_sales order by SALES desc limit 10
load:
  - step: sales_output
    df: clean_sales
    mode: overwrite
    format: parquet
    path: "output/sales.zstd.parquet"
    options:
      compression: zstd
